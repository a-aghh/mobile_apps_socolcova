name: Build Flutter Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # Позволяет запускать вручную

permissions:
  contents: write         # ОБЯЗАТЕЛЬНО для пуша build/web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Создаем Flutter проект прямо здесь (так как исходников нет)
      - name: Init Flutter project
        run: flutter create .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Commit and Push build/web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/web -f
          git commit -m "Auto-build: update build/web [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
