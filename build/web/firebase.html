<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auth (Вход и Регистрация)</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; color: #333; }
        .hidden { display: none !important; }
        
        /* Стили для вкладок */
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #0066cc; border-bottom-color: #0066cc; }

        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        
        button { width: 100%; padding: 12px; margin-top: 10px; cursor: pointer; border-radius: 4px; font-size: 16px; font-weight: bold; border: none; }
        .btn-primary { background-color: #0066cc; color: white; }
        .btn-primary:hover { background-color: #0052a3; }
        
        .github-btn { background-color: #24292e; color: white; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .github-btn:hover { background-color: #1b1f23; }

        .error { color: #d93025; font-size: 0.9em; margin-top: 10px; background: #fce8e6; padding: 10px; border-radius: 4px; }
        .success { color: #188038; font-size: 0.9em; margin-top: 10px; background: #e6f4ea; padding: 10px; border-radius: 4px; }

        .user-info { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-top: 20px; background: #f9f9f9; }
        hr { margin: 25px 0; border: none; border-top: 1px solid #ddd; }
        .text-center { text-align: center; margin-top: 15px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

    <!-- Блок авторизации -->
    <div id="auth-section">
        
        <!-- Вкладки -->
        <div class="tabs">
            <div class="tab active" id="tab-login">Вход</div>
            <div class="tab" id="tab-register">Регистрация</div>
        </div>

        <h2 id="form-title">Вход в систему</h2>

        <!-- Email / Пароль -->
        <div id="email-form">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Минимум 6 символов">
            </div>
            <button id="btn-submit" class="btn-primary">Войти</button>
        </div>

        <div id="message-box"></div>

        <hr>

        <!-- GitHub -->
        <button id="btn-github" class="github-btn">
            <svg height="20" viewBox="0 0 16 16" width="20" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
            Войти через GitHub
        </button>
    </div>
        <!-- Google -->
<button id="btn-google" class="btn-primary" style="background-color: #fff; color: #757575; border: 1px solid #ddd; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px;">
    <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>
    Войти через Google
</button>

    <!-- Блок профиля (скрыт по умолчанию) -->
    <div id="profile-section" class="hidden">
        <h2>Вы успешно вошли!</h2>
        <div class="user-info">
            <p><strong>Email:</strong> <span id="user-email">-</span></p>
            <p><strong>UID:</strong> <span id="user-uid">-</span></p>
            <p><strong>Способ входа:</strong> <span id="user-provider">-</span></p>
        </div>
        <button id="btn-logout" style="margin-top: 20px; background: #d93025; color: white;">Выйти</button>
    </div>

    <!-- Подключение Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword,
            GithubAuthProvider,
            GoogleAuthProvider,
            signInWithPopup,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // ============================================
        // 1. ВСТАВЬТЕ СЮДА ВАШУ КОНФИГУРАЦИЮ FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBU2XUR-PkP8qvMa0N46Uy_S6N3sMI-qVY",
            authDomain: "my-auth-app-2a44a.firebaseapp.com",
            projectId: "my-auth-app-2a44a",
            storageBucket: "my-auth-app-2a44a.firebasestorage.app",
            messagingSenderId: "259509661184",
            appId: "1:259509661184:web:b4140f54095b066aa332e5",
            measurementId: "G-MERHZVG40J"
        };

        // Инициализация Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GithubAuthProvider();
        const googleProvider = new GoogleAuthProvider(); 

        // ============================================
        // 2. ЭЛЕМЕНТЫ ИНТЕРФЕЙСА
        // ============================================
        const authSection = document.getElementById('auth-section');
        const profileSection = document.getElementById('profile-section');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const messageBox = document.getElementById('message-box');
        
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const formTitle = document.getElementById('form-title');
        const btnSubmit = document.getElementById('btn-submit');

        const userEmailSpan = document.getElementById('user-email');
        const userUidSpan = document.getElementById('user-uid');
        const userProviderSpan = document.getElementById('user-provider');

        let isRegisterMode = false;

        // ============================================
        // 3. ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК (Вход / Регистрация)
        // ============================================
        function setMode(register) {
            isRegisterMode = register;
            messageBox.innerHTML = ''; // Очищаем сообщения
            
            if (register) {
                tabLogin.classList.remove('active');
                tabRegister.classList.add('active');
                formTitle.textContent = 'Создание аккаунта';
                btnSubmit.textContent = 'Зарегистрироваться';
                btnSubmit.style.backgroundColor = '#188038'; // Зеленый цвет для регистрации
            } else {
                tabRegister.classList.remove('active');
                tabLogin.classList.add('active');
                formTitle.textContent = 'Вход в систему';
                btnSubmit.textContent = 'Войти';
                btnSubmit.style.backgroundColor = '#0066cc'; // Синий цвет для входа
            }
        }

        tabLogin.addEventListener('click', () => setMode(false));
        tabRegister.addEventListener('click', () => setMode(true));

        // ============================================
        // 4. ОБРАБОТКА EMAIL / ПАРОЛЯ
        // ============================================
        btnSubmit.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            messageBox.innerHTML = '';

            if (!email || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Пароль должен быть не менее 6 символов', 'error');
                return;
            }

            try {
                btnSubmit.disabled = true;
                btnSubmit.textContent = 'Загрузка...';

                if (isRegisterMode) {
                    // Регистрация
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    // Вход
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                let errorText = error.message;
                if (error.code === 'auth/email-already-in-use') errorText = 'Этот email уже зарегистрирован.';
                if (error.code === 'auth/invalid-email') errorText = 'Некорректный email.';
                if (error.code === 'auth/wrong-password') errorText = 'Неверный пароль.';
                if (error.code === 'auth/user-not-found') errorText = 'Пользователь с таким email не найден.';
                if (error.code === 'auth/weak-password') errorText = 'Слишком слабый пароль (нужно 6+ символов).';
                
                showMessage(errorText, 'error');
            } finally {
                btnSubmit.disabled = false;
                // Возвращаем правильный текст кнопки
                btnSubmit.textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
            }
        });

        // ============================================
        // 5. ВХОД ЧЕРЕЗ GITHUB
        // ============================================
        document.getElementById('btn-github').addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .catch((error) => {
                    if (error.code !== 'auth/popup-closed-by-user') {
                        showMessage('Ошибка GitHub: ' + error.message, 'error');
                    }
                });
        });
        // ============================================
        // 5.1 ВХОД ЧЕРЕЗ GOOGLE
        // ============================================
        document.getElementById('btn-google').addEventListener('click', () => {
            signInWithPopup(auth, googleProvider)
                .catch((error) => {
                    if (error.code !== 'auth/popup-closed-by-user') {
                        showMessage('Ошибка Google: ' + error.message, 'error');
                    }
                });
        });

        // ============================================
        // 6. ВЫХОД И ОТСЛЕЖИВАНИЕ СОСТОЯНИЯ
        // ============================================
        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth);
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Пользователь вошел
                authSection.classList.add('hidden');
                profileSection.classList.remove('hidden');
                messageBox.innerHTML = '';

                userEmailSpan.textContent = user.email || 'Не указан';
                userUidSpan.textContent = user.uid;
                
                const providerId = user.providerData[0]?.providerId || 'unknown';
                userProviderSpan.textContent = 
                providerId === 'github.com' ? 'GitHub' : 
                providerId === 'google.com' ? 'Google' : 'Email и пароль';

                
                // Очистка полей
                emailInput.value = '';
                passwordInput.value = '';
            } else {
                // Пользователь вышел
                authSection.classList.remove('hidden');
                profileSection.classList.add('hidden');
                setMode(false); // Сбрасываем на вкладку "Вход"
            }
        });

        // Вспомогательная функция для вывода сообщений
        function showMessage(text, type) {
            messageBox.innerHTML = `<div class="${type}">${text}</div>`;
        }
    </script>
</body>
</html>
